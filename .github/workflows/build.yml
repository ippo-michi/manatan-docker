name: Build & push runner image (GHCR) on upstream release

on:
  schedule:
    - cron: "23 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  UPSTREAM: KolbyML/Manatan
  IMAGE: ghcr.io/${{ github.repository_owner }}/manatan

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read upstream latest release + asset URLs
        id: rel
        run: |
          set -euo pipefail
          api="${{ github.api_url }}/repos/${UPSTREAM}/releases/latest"
          json="$(curl -fsSL "$api")"

          tag="$(echo "$json" | jq -r .tag_name)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          echo "Upstream assets:"
          echo "$json" | jq -r '.assets[].name'

          amd_url="$(echo "$json" | jq -r '
            .assets[]
            | select(.name|test("linux.*(amd64|x86_64|x64).*\\.tar\\.gz$"))
            | .browser_download_url' | head -n1)"

          arm_url="$(echo "$json" | jq -r '
            .assets[]
            | select(.name|test("linux.*(arm64|aarch64).*\\.tar\\.gz$"))
            | .browser_download_url' | head -n1)"

          if [ -z "$amd_url" ] || [ -z "$arm_url" ]; then
            echo "Could not find matching linux tar.gz assets for amd64/arm64"
            exit 1
          fi

          echo "amd_url=$amd_url" >> "$GITHUB_OUTPUT"
          echo "arm_url=$arm_url" >> "$GITHUB_OUTPUT"

      - name: Skip if already built
        id: skip
        run: |
          set -euo pipefail
          last="$(cat .last_upstream_tag 2>/dev/null || true)"
          if [ "$last" = "${{ steps.rel.outputs.tag }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download upstream artifacts into build context
        if: steps.skip.outputs.skip != 'true'
        run: |
          set -euo pipefail
          curl -fsSL "${{ steps.rel.outputs.amd_url }}" -o manatan-linux-amd64.tar.gz
          curl -fsSL "${{ steps.rel.outputs.arm_url }}" -o manatan-linux-arm64.tar.gz

      - name: Set up QEMU (multi-arch)
        if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.skip.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        if: steps.skip.outputs.skip != 'true'
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "${IMAGE}:${{ steps.rel.outputs.tag }}" \
            -t "${IMAGE}:latest" \
            --push .

      - name: Record built upstream tag
        if: steps.skip.outputs.skip != 'true'
        run: |
          echo "${{ steps.rel.outputs.tag }}" > .last_upstream_tag
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .last_upstream_tag
          git commit -m "Build ${UPSTREAM} ${{ steps.rel.outputs.tag }}" || true
          git push
